name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: Validate configuration and shell scripts
        run: |
          node -e "JSON.parse(require('fs').readFileSync('config/default-agents.json', 'utf8'))"
          bash -n install.sh rebuild-pty.sh
